// Version: 001.000.008

syntax = "proto3";

option go_package = "dev/ccs-service/dbag/gen/eex.spot";

package eex.spot;

enum UpdateAction
{
	UNKNOWN_UPDATE_ACTION = 0;
	NEW = 1;
	UPDATE = 2;
	DELETE = 3;
}

message Identification
{
	string						Cmdty			= 1;
	string						Area			= 2;
	string						ShortCode		= 3;
	string						LongName		= 4;
	string						DeliveryDay		= 5;
	string						UOM				= 6;
	string						Currency		= 7;
	string						TrdDate			= 8;
	double						ContractVol		= 9;
	string						Start			= 10;
	string						End				= 11;
	int32						DeliveryHours	= 12;
}

message ReferenceData
{
	message ProductTypeValue
	{
		enum ProductType
		{
			UNKNOWN_PRODUCT_TYPE = 0;
			DAY = 1;
			HOURLY = 2;
			WEEKDAY = 3;
			WEEKEND = 4;
			DAYAHEAD = 5;
			SATURDAY = 6;
			SUNDAY = 7;
			BUSINESSHOLIDAY = 8;
		}

		ProductType				Value			= 1;
	}

	Identification				ID				= 1;

	ProductTypeValue			Product			= 2;
	string						StartTm			= 3;
	string						EndTm			= 4;

	int64						Tm				= 99;
}

message Trade
{
	message AggressorSideValue
	{
		enum AggressorSide
		{
			UNKNOWN_AGGRESSOR_SIDE = 0;
			SELL = 1;
			BUY = 2;
		}

		AggressorSide			Value			= 1;
	}

	Identification				ID				= 1;

	UpdateAction				UpdtAct			= 2;
	int64						TrdID			= 3;
	string						TrdVersion		= 4;
	int64						RelationshipID	= 5;
	int64						GroupID			= 6;
	AggressorSideValue			AgrsrAct		= 7;
	bool						FromBrokenSpread= 8;
	double						Px				= 9;
	double						Sz				= 10;
	double						TrdVol			= 11;

	int64						Tm				= 99;
}

message Settlement
{
	Identification				ID				= 1;

	double						Px				= 2;

	int64						Tm				= 99;
	//string						UpdtAct			= 14;
}

message TopOfBook
{
	Identification				ID				= 1;

	double						BidPx			= 2;
	double						BidSz			= 3;
	double						AskPx			= 4;
	double						AskSz			= 5;

	int64						Tm				= 99;
}

message Order
{
	message SideValue
	{
		enum Side
		{
			UNKNOWN_SIDE = 0;
			ASK = 1;
			BID = 2;
		}

		Side					Value			= 1;
	}

	message OrderTypeValue
	{
		enum OrderType
		{
			UNKNOWN_ORDERTYPE = 0;
			GOOD_TILL_DATE = 1;
			GOOD_TILL_CANCELLED = 2;
			GOOD_FOR_DAY = 3;
		}

		OrderType				Value			= 1;
	}

	message StatusValue
	{
		enum Status
		{
			UNKNOWN_STATUS = 0;
			FIRM = 1;
			WITHHELD = 2;
		}

		Status					Value			= 1;
	}

	Identification				ID				= 1;

	UpdateAction				UpdtAct			= 2;
	int64						EngineID		= 3;
	int64						OrderID			= 4;
	int64						RefOrderID		= 5;
	double						Px				= 6;
	int64						Sz				= 7;
	SideValue					Side			= 8;
	OrderTypeValue				Type			= 9;
	StatusValue					Sts				= 10;

	int64						Tm				= 99;
}
